<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
<title id="title">LINGAUX — Speak Learn Progress</title>
<desc id="desc">Gradient ribbon forming LINGAUX initial with upward arrow road</desc>
<defs>
  <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#6D28D9"/><stop offset="35%" stop-color="#7C3AED"/><stop offset="65%" stop-color="#EC4899"/><stop offset="100%" stop-color="#FB923C"/>
  </linearGradient>
  <linearGradient id="ribbon2" x1="0%" y1="100%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FB7185"/><stop offset="50%" stop-color="#F43F5E"/><stop offset="100%" stop-color="#7C3AED"/>
  </linearGradient>
  <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8B5CF6"/><stop offset="50%" stop-color="#EC4899"/><stop offset="100%" stop-color="#FB923C"/>
  </linearGradient>
  <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#1E1B4B"/><stop offset="100%" stop-color="#1E1B4B"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12"/>
  </filter>
</defs>
<rect width="800" height="500" fill="white" rx="24"/>
<!-- Ribbon -->
<g filter="url(#shadow)">
  <!-- Back ribbon part -->
  <path d="M 260 110 C 250 130, 245 190, 280 230 L 420 280 C 480 310, 520 290, 540 220 L 520 180 C 500 230, 470 250, 410 230 L 300 190 C 270 170, 260 130, 260 110 Z" fill="url(#ribbon1)" stroke="white" stroke-width="2" stroke-opacity="0.3"/>
  <!-- Front wave -->
  <path d="M 170 340 C 190 280, 260 250, 320 290 L 420 320 C 460 340, 500 330, 540 280 L 620 150 C 640 110, 660 90, 580 80 C 540 150, 500 250, 440 270 L 330 230 C 270 210, 210 260, 170 340 Z" fill="url(#ribbon2)" stroke="white" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Highlight -->
  <path d="M 180 330 C 200 285, 255 255, 310 285" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <path d="M 275 125 C 265 145, 262 175, 282 205" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
  <!-- Arrow road dashed -->
  <g transform="translate(540, 280)">
    <path d="M 0 0 L 80 -130 L 60 -135 L 95 -155 L 115 -95 L 90 -105 L 10 30 Z" fill="url(#arrowGrad)" stroke="white" stroke-width="1" stroke-opacity="0.2"/>
    <g stroke="white" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 14" opacity="0.95">
      <path d="M 15 20 L 85 -120"/>
    </g>
    <path d="M 8 28 C 15 22, 25 10, 45 -30" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>
  </g>
</g>
<!-- LINGAUX Text -->
<g font-family="Montserrat, Inter, sans-serif" text-anchor="middle">
  <!-- LINGAUX -->
  <text x="400" y="410" font-size="92" font-weight="900" letter-spacing="-2" fill="#1E1B4B">L</text>
  <!-- Custom I with heart -->
  <g transform="translate(158, 340)">
    <rect x="0" y="0" width="28" height="68" rx="4" fill="#1E1B4B"/>
    <path d="M 14 -12 C 6 -18, -2 -12, 2 0 C 6 8, 14 18, 14 18 C 14 18, 22 8, 26 0 C 30 -12, 22 -18, 14 -12 Z" fill="url(#ribbon2)" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="400" y="410" font-size="92" font-weight="900" letter-spacing="-2" fill="#1E1B4B"><tspan dx=" -38">INGAUX</tspan></text>
  <!-- Sound waves on X -->
  <g transform="translate(660, 360)">
    <rect x="0" y="12" width="6" height="14" rx="3" fill="#EC4899" opacity="0.9"/>
    <rect x="10" y="8" width="6" height="22" rx="3" fill="#F43F5E" opacity="0.9"/>
    <rect x="20" y="3" width="6" height="32" rx="3" fill="#FB7185"/>
    <rect x="30" y="0" width="7" height="38" rx="3" fill="#FB923C"/>
    <rect x="40" y="8" width="6" height="22" rx="3" fill="#F43F5E" opacity="0.7"/>
    <rect x="50" y="12" width="6" height="14" rx="3" fill="#EC4899" opacity="0.6"/>
  </g>
  <!-- Tagline -->
  <text x="400" y="445" font-size="16" font-weight="600" letter-spacing="8" fill="#1E1B4B">SPEAK</text>
  <circle cx="252" cy="441" r="5" fill="#2DD4BF"/>
  <text x="400" y="445" font-size="16" font-weight="600" letter-spacing="8" fill="#1E1B4B"><tspan dx=" -12">LEARN</tspan></text>
  <circle cx="548" cy="441" r="5" fill="#2DD4BF"/>
  <text x="590" y="445" font-size="16" font-weight="600" letter-spacing="8" fill="#1E1B4B">PROGRESS</text>
  <!-- Bottom swoosh -->
  <path d="M 120 475 C 250 445, 550 435, 680 475" fill="none" stroke="url(#ribbon1)" stroke-width="4" stroke-linecap="round"/>
</g>
</svg>
